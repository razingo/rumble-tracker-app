# Runs the tests and the style check on every push and pull request. Windows, as the tracker runs there, so the tray
# icon and Windows integration scripts are tested too. Read-only: no permissions beyond reading the repository and no
# stored git credentials.
name: Test

on:
  push:
    branches: ['**']
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # the same Node.js as release builds
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'

      - name: Test
        run: npm test

      - name: Check style
        run: npm run check-style
