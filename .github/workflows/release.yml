# Builds the Windows release on GitHub's runners.
#
#   Push a tag v<version> (matching package.json): builds, attests and creates a draft release with the zip and
#   SHA256SUMS.txt. Review the draft, edit the notes, publish.
#   Run manually (Actions > Release > Run workflow): builds and attests only; the files are a workflow artifact.
#
# Verify a downloaded file:  gh attestation verify RumbleTracker.exe --repo razingo/rumble-tracker-app
#
# Hardening: no permissions by default; the build job can't write to the repository (and keeps no git credentials);
# only the release job, which runs no repository code, can create releases. Actions are pinned to commit SHAs.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write       # build attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # must match desktop/node-LICENSE.txt, which ships in the zip
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'

      - name: Check the tag matches package.json
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match package.json version $version" }

      - name: Test
        run: npm test

      - name: Build
        run: npm run build-release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/release/RumbleTracker.exe
            dist/release/RumbleTracker-*-win-x64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/release/RumbleTracker-*-win-x64.zip
            dist/release/SHA256SUMS.txt

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create the draft release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "Download **RumbleTracker-${version}-win-x64.zip**, extract it anywhere and run **RumbleTracker.exe** (Windows 10/11, 64-bit). Windows may show \"Windows protected your PC\" the first time: click **More info**, then **Run anyway**. The first start downloads the game data (about 4.5 MB)."
            echo
            echo "See the [player guide](https://github.com/razingo/rumble-tracker-app/blob/main/docs/INSTRUCTIONS.md)."
            echo
            echo "SHA-256 checksums:"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo
            echo "Built by GitHub Actions from this repository. Verify a download with:"
            echo '`gh attestation verify RumbleTracker.exe --repo razingo/rumble-tracker-app`'
            echo
            echo "Not affiliated with or endorsed by Blizzard Entertainment."
          } > release-notes.md
          gh release create "$GITHUB_REF_NAME" "dist/RumbleTracker-${version}-win-x64.zip" dist/SHA256SUMS.txt \
            --draft --title "Rumble Collection Tracker ${version}" --notes-file release-notes.md
