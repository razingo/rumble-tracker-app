# Builds the Windows release on GitHub's runners.
#
#   Push a tag v<version> (matching package.json): builds, attests and creates a draft release with the zip and
#   SHA256SUMS.txt. Review the draft, edit the notes, publish.
#   Run manually (Actions > Release > Run workflow): builds and attests only; the files are a workflow artifact.
#
# Verify a downloaded file:  gh attestation verify RumbleTracker.exe --repo razingo/rumble-tracker-app
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write      # create the draft release
  id-token: write      # build attestation
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # must match desktop/node-LICENSE.txt, which ships in the zip
      - uses: actions/setup-node@v7
        with:
          node-version: '26.13.1'

      - name: Check the tag matches package.json
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match package.json version $version" }

      - name: Fetch the game data (signed pack)
        run: npm run fetch-gamedata

      - name: Build
        run: npm run build-release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/release/RumbleTracker.exe
            dist/release/RumbleTracker-*-win-x64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            dist/release/RumbleTracker-*-win-x64.zip
            dist/release/SHA256SUMS.txt

      - name: Create draft release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $sums = Get-Content dist/release/SHA256SUMS.txt -Raw
          $notes = @"
          Download **RumbleTracker-$version-win-x64.zip**, extract it anywhere and run **RumbleTracker.exe** (Windows 10/11, 64-bit). Windows may show "Windows protected your PC" the first time: click **More info**, then **Run anyway**.

          See the [player guide](https://github.com/razingo/rumble-tracker-app/blob/main/docs/INSTRUCTIONS.md).

          SHA-256 checksums:

          ``````
          $sums``````

          Built by GitHub Actions from this repository. Verify a download with:
          ``gh attestation verify RumbleTracker.exe --repo razingo/rumble-tracker-app``

          Not affiliated with or endorsed by Blizzard Entertainment.
          "@
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          gh release create $env:GITHUB_REF_NAME "dist/release/RumbleTracker-$version-win-x64.zip" dist/release/SHA256SUMS.txt --draft --title "Rumble Collection Tracker $version" --notes-file release-notes.md
